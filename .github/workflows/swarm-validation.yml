name: swarm-validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-fixture-suite:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out swarm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema PyYAML
      - name: Validate shell launchers
        run: |
          bash -n packaging/hermes-swarm
          bash -n packaging/hermes-swarm-mcp
          bash -n scripts/validate-swarm.sh
      - name: Reject tracked runtime or secret artifacts
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key|p12|sqlite|sqlite3|jsonl|log)$|__pycache__/|\.pytest_cache/)'; then
            echo "tracked runtime or secret artifact detected" >&2
            exit 1
          fi
          if git grep -n -I -E -- '-----BEGIN[[:space:]]+([^[:space:]]+[[:space:]]+)?PRIVATE[[:space:]]+KEY-----' -- .; then
            echo "tracked private-key block detected" >&2
            exit 1
          fi
      - name: Run portable deterministic fixture suite
        run: bash scripts/validate-swarm.sh --portable


  pull-request-codebase-review:
    name: Read-only PR codebase review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema PyYAML
      - name: Build read-only quality report
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python -m swarm.cli quality-review \
            --repository . \
            --output artifacts/quality-review.json
      - name: Build revision-bound codebase index
        run: |
          PYTHONPATH=. python -m swarm.cli codebase-index-build \
            --repository . \
            --index-path /tmp/forgewarden-codebase-index.json \
            --revision "${{ github.sha }}"
      - name: Build index evidence
        run: |
          PYTHONPATH=. python -m swarm.cli index-evidence \
            --quality-report artifacts/quality-review.json \
            --repository . \
            --index-path /tmp/forgewarden-codebase-index.json \
            --revision "${{ github.sha }}" \
            --actor github-actions-pr-review \
            --output artifacts/index-evidence.json
      - name: Validate review artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          checks = [
              ('artifacts/quality-review.json', 'schemas/quality-review.schema.json'),
              ('artifacts/index-evidence.json', 'schemas/codebase-index-evidence.schema.json'),
          ]
          for artifact, schema in checks:
              jsonschema.validate(json.loads(Path(artifact).read_text()), json.loads(Path(schema).read_text()))
          PY
      - name: Upload read-only review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forgewarden-pr-review-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
