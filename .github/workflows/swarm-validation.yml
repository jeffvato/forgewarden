name: swarm-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-fixture-suite:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out swarm
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema PyYAML
      - name: Validate shell launchers
        run: |
          bash -n packaging/hermes-swarm
          bash -n packaging/hermes-swarm-mcp
      - name: Run portable deterministic fixture suite
        run: >-
          python -m pytest -q
          tests/test_swarm.py
          tests/test_codex_telemetry.py
          tests/test_environment_safety.py
          tests/test_gemini_reviewer.py
          tests/test_packaging.py
          tests/test_paths.py
          tests/test_systemd_scope.py
          tests/test_systemd_unit.py
