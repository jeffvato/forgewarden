name: swarm-validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: swarm-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deterministic-fixture-suite:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out swarm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: timeout 5m python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate shell launchers
        run: |
          bash -n packaging/hermes-swarm
          bash -n packaging/hermes-swarm-mcp
          bash -n scripts/validate-swarm.sh
      - name: Validate machine-readable safety invariants
        run: timeout 1m env PYTHONPATH=. python scripts/validate-invariants.py
      - name: Validate architecture drift boundaries
        run: timeout 1m env PYTHONPATH=. python scripts/validate-architecture-drift.py
      - name: Reject tracked runtime or secret artifacts
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)(\.env($|\.)|.*\.(pem|key|p12|sqlite|sqlite3|jsonl|log)$|__pycache__/|\.pytest_cache/)'; then
            echo "tracked runtime or secret artifact detected" >&2
            exit 1
          fi
          if git grep -n -I -E -- '-----BEGIN[[:space:]]+([^[:space:]]+[[:space:]]+)?PRIVATE[[:space:]]+KEY-----' -- .; then
            echo "tracked private-key block detected" >&2
            exit 1
          fi
      - name: Run portable deterministic fixture suite
        run: timeout 8m bash scripts/validate-swarm.sh --portable
      - name: Run current full pytest suite
        run: timeout 12m python -m pytest -q
      - name: Validate Mission Control frontend contract
        run: timeout 2m node --test tests/test_console_frontend.js
      - name: Check tracked patch whitespace
        run: timeout 1m git diff --check HEAD


  pull-request-codebase-review:
    name: Read-only PR codebase review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: timeout 5m python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Build read-only quality report
        run: |
          mkdir -p artifacts
          timeout 5m env PYTHONPATH=. python -m swarm.cli quality-review \
            --repository . \
            --output artifacts/quality-review.json
      - name: Build revision-bound codebase index
        run: |
          timeout 5m env PYTHONPATH=. python -m swarm.cli codebase-index-build \
            --repository . \
            --index-path /tmp/forgewarden-codebase-index.json \
            --revision "${{ github.sha }}"
      - name: Build index evidence
        run: |
          timeout 5m env PYTHONPATH=. python -m swarm.cli index-evidence \
            --quality-report artifacts/quality-review.json \
            --repository . \
            --index-path /tmp/forgewarden-codebase-index.json \
            --revision "${{ github.sha }}" \
            --actor github-actions-pr-review \
            --output artifacts/index-evidence.json
      - name: Validate review artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          checks = [
              ('artifacts/quality-review.json', 'schemas/quality-review.schema.json'),
              ('artifacts/index-evidence.json', 'schemas/codebase-index-evidence.schema.json'),
          ]
          for artifact, schema in checks:
              jsonschema.validate(json.loads(Path(artifact).read_text()), json.loads(Path(schema).read_text()))
          PY
      - name: Publish PR review summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          quality = json.loads(Path("artifacts/quality-review.json").read_text())
          index = json.loads(Path("artifacts/index-evidence.json").read_text())
          counts = quality.get("counts", {})
          lines = [
              "## Forge Warden PR review",
              "",
              "- Mode: read-only",
              f"- Source files scanned: {quality.get('source_files_scanned', 0)}",
              f"- Risk counts: SAFE={counts.get('SAFE', 0)}, CAREFUL={counts.get('CAREFUL', 0)}, RISKY={counts.get('RISKY', 0)}",
              f"- Indexed finding files matched: {len(index.get('matched_files', []))}",
              f"- Finding files missing from index: {len(index.get('missing_files', []))}",
              f"- Revision: `{index.get('revision', 'unknown')}`",
              "",
              "> This review is advisory. It does not authorize mutation, merge, deployment, or publishing.",
              "> Detector coverage and language limitations remain in the quality-review artifact.",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("artifacts/review-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload read-only review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forgewarden-pr-review-${{ github.event.pull_request.number }}
          path: artifacts/
          if-no-files-found: error
