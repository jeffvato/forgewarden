profile: hermes-coding-swarm-phase1
mode: DRY_RUN
local_only: true
automatic_deployment: false
repository_roots: []
eligible_scopes: []
read_only:
  existing_tests: none
  other_source_and_configuration: none
human_required_scopes:
  - database
  - migrations
  - pricing
  - MAP
  - checkout
  - payments
  - orders
  - WooCommerce
  - distributor-APIs
  - GunBroker-writes
  - credentials
  - security-middleware
  - Docker
  - deployment
  - FFL-rules
  - state-restrictions
  - NFA-filtering
roles:
  orchestrator: hermes
  application_writer: codex
  reviewer: gemini-read-only
limits:
  max_concurrent_jobs: 1
  max_review_cycles: 3
  command_timeout_seconds: 180
  max_memory_bytes: 2147483648
  memory_control: systemd-user-cgroup
  max_log_bytes: 256000
kill_switch: .swarm-state/KILL_SWITCH
