profile: hermes-coding-swarm-phase1
mode: DRY_RUN
local_only: true
automatic_deployment: false
repository_roots:
  - /home/jeff/swarm-repositories/n8n-csv-baseline-v2
eligible_scopes:
  - /home/jeff/swarm-repositories/n8n-csv-baseline-v2/csv-processor/app/ai/deadline.py
  - /home/jeff/swarm-repositories/n8n-csv-baseline-v2/csv-processor/tests/swarm_regressions/
read_only:
  existing_tests: /home/jeff/swarm-repositories/n8n-csv-baseline-v2/csv-processor/tests/
  other_source_and_configuration: /home/jeff/swarm-repositories/n8n-csv-baseline-v2/csv-processor/
human_required_scopes:
  - database
  - migrations
  - pricing
  - MAP
  - checkout
  - payments
  - orders
  - WooCommerce
  - distributor-APIs
  - GunBroker-writes
  - credentials
  - security-middleware
  - Docker
  - deployment
  - FFL-rules
  - state-restrictions
  - NFA-filtering
roles:
  orchestrator: hermes
  application_writer: codex
  reviewer: claude-read-only
limits:
  max_concurrent_jobs: 1
  max_review_cycles: 3
  command_timeout_seconds: 180
  max_memory_bytes: 2147483648
  memory_control: systemd-user-cgroup
  max_log_bytes: 256000
kill_switch: .swarm-state/KILL_SWITCH
