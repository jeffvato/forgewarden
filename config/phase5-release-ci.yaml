schema_version: "1"
publication: DISABLED
format: FORGEWARDEN_CLEAN_EXPORT_CI_V1
repository_format: FORGEWARDEN_RELEASE_REPOSITORY_V1
source_manifest_name: FORGEWARDEN-PUBLIC-MANIFEST.json
provenance_name: FORGEWARDEN-PROVENANCE.json
license_concluded: NOASSERTION
license_declared: NOASSERTION
legal_status: PENDING
production_ready: false

runtime_search_path:
  - /usr/local/bin
  - /usr/bin
  - /bin

limits:
  max_commands: 3
  max_command_seconds: 15
  max_output_bytes: 8192
  max_file_bytes: 524288
  max_total_bytes: 1048576

tracks:
  PUBLIC_SDK:
    required_files:
      - FORGEWARDEN-PROVENANCE.json
      - FORGEWARDEN-PUBLIC-MANIFEST.json
      - docs/add-on-sdk.md
      - schemas/addon-manifest.schema.json
    checks:
      - id: SDK_CONTRACT
        runtime: PYTHON
        success_marker: SDK_CONTRACT_OK
  SOURCE_AVAILABLE_DEMO:
    required_files:
      - FORGEWARDEN-PROVENANCE.json
      - FORGEWARDEN-PUBLIC-MANIFEST.json
      - console/app.js
      - console/demo-data.json
      - console/index.html
      - console/styles.css
      - swarm/mission_control_demo.py
    checks:
      - id: DEMO_PROVIDER
        runtime: PYTHON
        success_marker: DEMO_PROVIDER_OK
      - id: DEMO_JAVASCRIPT_SYNTAX
        runtime: NODE
        success_marker: NO_OUTPUT

required_pending_gates:
  - legal_review
  - chain_of_title_review
  - trademark_media_review
  - dependency_sbom_review
  - reproducible_build_review
  - clean_export_ci_review
  - customer_root_release_approval

required_denials:
  - INVALID_REPOSITORY_RESULT
  - DIRTY_OR_TAMPERED_REPOSITORY
  - EXTRA_OBJECT_REF_OR_FILE
  - CROSS_TRACK_EXECUTION
  - PRIVATE_CORE_DEPENDENCY
  - AMBIENT_CREDENTIAL_OR_IDENTITY
  - UNKNOWN_COMMAND_OR_RUNTIME
  - GENERATED_STATE
  - COMMAND_FAILURE_TIMEOUT_OR_OVERFLOW
  - NETWORK_REMOTE_OR_PACKAGE_OPERATION
  - LICENSE_PUBLICATION_OR_PRODUCTION_CLAIM
  - AUTHORITY
